[project]
name = "control-plane-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "nats-contracts",
    "nats-py>=2.16.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "control_plane_server"
namespace = true


[tool.uv.sources]
nats-contracts = { git = "https://github.com/jakostawind-trading-bot-ops/nats_contracts.git", rev = "c18856a180d1118fb88b9c0b26e4043b696a9a67" }
